version: 2

seeds:
  - name: lakes
    description: The 13-lake watchlist, matching bdgroves/Alpine-watch's fetch_lakes.py.
    columns:
      - name: lake_id
        data_tests:
          - unique
          - not_null

  - name: gages
    description: The 6 Sierra Nevada streamgages.
    columns:
      - name: gage_id
        data_tests:
          - unique
          - not_null
